[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlex-search"
version = "2.0.0"
authors = [
  { name="Daksh Goel", email="daksh@example.com" },
]
description = "A hybrid C++20 + Python desktop search engine with BM25F ranking and multimodal extraction"
readme = "readme.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyQt5>=5.15.9",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.8",
    "watchdog>=3.0.0",
]

[project.scripts]
smartlex = "smartlex.main:main"
smartlex-cli = "smartlex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
